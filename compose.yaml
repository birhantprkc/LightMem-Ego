name: lightmem-ego

services:
  backend-api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    environment:
      EM2MEM_API_HOST: 0.0.0.0
      EM2MEM_API_PORT: 8000
    volumes:
      - ./docker-data/sessions:/app/backend/online_sessions
      - ./docker-data/tasks:/app/backend/online_tasks
      - ./docker-data/tasks-aborted:/app/backend/online_tasks_aborted
      - ./docker-data/runtime:/app/backend/runtime
      - ./docker-data/logs:/app/backend/logs
    expose:
      - "8000"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ping', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend-workers:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    command: ["/usr/local/bin/backend-worker-entrypoint"]
    environment:
      EM2MEM_API_HOST: backend-api
      EM2MEM_API_PORT: 8000
      EM2MEM_VLM2VEC_EMBED_HOST: ${EM2MEM_VLM2VEC_EMBED_HOST:-vlm2vec}
      EM2MEM_TEXT_EMBED_HOST: ${EM2MEM_TEXT_EMBED_HOST:-text-embedding}
    depends_on:
      backend-api:
        condition: service_healthy
    volumes:
      - ./docker-data/sessions:/app/backend/online_sessions
      - ./docker-data/tasks:/app/backend/online_tasks
      - ./docker-data/tasks-aborted:/app/backend/online_tasks_aborted
      - ./docker-data/runtime:/app/backend/runtime
      - ./docker-data/logs:/app/backend/logs
      - ${MODEL_DIR:-./docker-data/models}:/data/em2mem/models:ro

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_DEMO_API_BASE_URL: ${VITE_DEMO_API_BASE_URL:-}
    depends_on:
      backend-api:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"

  vlm2vec:
    profiles: [models]
    build:
      context: .
      dockerfile: docker/model.Dockerfile
    environment:
      MODEL_SERVICE: vlm2vec
      EM2MEM_VLM2VEC_EMBED_HOST: 0.0.0.0
      EM2MEM_VLM2VEC_EMBED_PORT: 18091
      EM2MEM_VLM2VEC_MODEL_PATH: /data/models/VLM2Vec-V2.0
      EM2MEM_VLM2VEC_DEVICE: ${EM2MEM_VLM2VEC_DEVICE:-cuda}
      EM2MEM_VLM2VEC_DTYPE: ${EM2MEM_VLM2VEC_DTYPE:-float16}
    volumes:
      - ${MODEL_DIR:-./docker-data/models}:/data/models:ro
      - ./docker-data/sessions:/app/backend/online_sessions:ro
    expose:
      - "18091"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  text-embedding:
    profiles: [models]
    build:
      context: .
      dockerfile: docker/model.Dockerfile
    environment:
      MODEL_SERVICE: text
      EM2MEM_TEXT_EMBED_HOST: 0.0.0.0
      EM2MEM_TEXT_EMBED_PORT: 18096
      EM2MEM_TEXT_EMBED_MODEL: /data/models/Qwen3-Embedding-4B
      EM2MEM_TEXT_EMBED_DEVICE: ${EM2MEM_TEXT_EMBED_DEVICE:-cuda:0}
    volumes:
      - ${MODEL_DIR:-./docker-data/models}:/data/models:ro
    expose:
      - "18096"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  srs:
    profiles: [live]
    image: ossrs/srs:5
    command: ["./objs/srs", "-c", "conf/docker.conf"]
    volumes:
      - ./src/backend/deploy/srs/srs.conf:/usr/local/srs/conf/docker.conf:ro
    ports:
      - "${SRS_RTMP_PORT:-1935}:1935"
      - "${SRS_HTTP_API_PORT:-1985}:1985"
      - "${SRS_HTTP_SERVER_PORT:-8081}:8080"
      - "${SRS_RTC_UDP_PORT:-8000}:8000/udp"
